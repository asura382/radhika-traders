<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <meta name="description" content="Explore plywood, door designs and architectural hardware at Radhika Traders. Browse illustrative product references and request a quotation." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Radhika Traders — Materials, Design & Details" />
    <meta property="og:description" content="A considered showroom experience for plywood, doors and architectural hardware." />
    <meta property="og:image" content="/images/walnut-door.webp" />
    <link rel="icon" type="image/png" href="/brand-reference/radhika-mark-gold.png" />
    <title>Radhika Traders — Materials, Design & Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="app-startup-fallback" role="status" aria-live="polite">
        <div class="startup-mark">R</div>
        <p class="startup-kicker">RADHIKA TRADERS</p>
        <h1>Preparing the showroom</h1>
        <p class="startup-message" data-startup-message>The website is starting. This screen will disappear when the preview is ready.</p>
        <p class="startup-detail" data-startup-detail></p>
      </div>
    </div>
    <script>
      (function () {
        var fallback = document.getElementById('app-startup-fallback');
        if (!fallback) return;
        var message = fallback.querySelector('[data-startup-message]');
        var detail = fallback.querySelector('[data-startup-detail]');
        function showFailure(title, description) {
          fallback.classList.add('startup-failed');
          fallback.querySelector('h1').textContent = title;
          message.textContent = 'The React application did not finish starting. The original error is shown below.';
          detail.textContent = String(description || 'No additional browser error details were provided.');
        }
        window.addEventListener('error', function (event) {
          showFailure('The showroom could not start.', event.message || 'A JavaScript module or asset failed to load.');
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason && (event.reason.stack || event.reason.message) || event.reason;
          showFailure('The showroom encountered an error.', reason || 'An unhandled promise rejection occurred.');
        });
        window.setTimeout(function () {
          if (document.getElementById('app-startup-fallback')) {
            showFailure('The preview is taking too long to start.', 'Stop the Vite server with Ctrl+C, then run: npm run dev:clean. Hard-refresh the browser with Ctrl+Shift+R.');
          }
        }, 10000);
      })();
    </script>
    <style>
      #app-startup-fallback { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; background: #101010; color: #f4f0e7; text-align: center; font-family: Arial, sans-serif; }
      #app-startup-fallback .startup-mark { width: 54px; height: 54px; display: grid; place-items: center; border: 1px solid #c5a15a; color: #c5a15a; font-family: Georgia, serif; font-size: 30px; margin-bottom: 22px; }
      #app-startup-fallback .startup-kicker { margin: 0 0 12px; color: #c5a15a; font-size: 10px; letter-spacing: .2em; }
      #app-startup-fallback h1 { max-width: 620px; margin: 0 0 12px; font: 400 clamp(30px, 5vw, 48px)/1.1 Georgia, serif; }
      #app-startup-fallback .startup-message { max-width: 560px; color: #c7c1b5; font-size: 14px; line-height: 1.7; }
      #app-startup-fallback .startup-detail { max-width: 760px; color: #e3bd78; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.6 Consolas, monospace; }
      #app-startup-fallback.startup-failed { align-items: flex-start; text-align: left; }
      #app-startup-fallback.startup-failed > * { width: min(100%, 760px); margin-left: auto; margin-right: auto; }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
